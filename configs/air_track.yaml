# Run config -- Air Track Triage (faithfulness-under-GRPO experiment).
#
# Domain: air-track identification and triage (clear / monitor / escalate).
# Platform authored by examples/author_air_track_platform.py; dataset from
# the ambertraceai SDK examples (MIT licensed, synthetic/seeded).
#
# AMBERTRACE_API_KEY (scoped, platform-only) comes from the environment.
domain:
  platform_id: 1196
  base_url: https://app.ambertrace.ai
  query_template: "Triage this track: {facts}"
  parser: json_block
  parser_args:
    answer_key: triage
    facts_key: facts

reward:
  shaper: default
  weights: { format: 0.1, certified: 0.5, correctness: 1.0, graded: 0.3, rejected_penalty: 0.2, consistency: 0.0 }
  clip: [-1.0, 2.0]

verifier:
  batch_size: 16
  max_concurrency: 8
  cache: true

training:
  framework: mlx_grpo
  # Model selection is a CLI concern for the MLX example (examples/faithfulness_mlx_grpo.py
  # --model); this placeholder satisfies the config schema.
  model: allenai/OLMo-3-7B-Think-SFT
  group_size: 4
  learning_rate: 3.0e-6
  max_steps: 20
