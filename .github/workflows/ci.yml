name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Org-level Fly self-hosted runner (fly-lhr-runner), registered at the
    # ambertrace-labs org — eliminates GH-hosted minutes for per-PR CI. Safe here
    # because this job installs no torch/CUDA (torch lives only in the `trl` extra),
    # uses no `gh` CLI or git+ssh deps, and builds no Docker image. setup-python
    # below fetches its own interpreter, so the runner needs no preinstalled Python.
    # Release (release.yml) stays on ubuntu-latest: its publish step is a Docker
    # container action. Single runner ⇒ the two matrix legs serialize.
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check
      - name: Type check
        run: pyright
      - name: Compile examples & benchmarks
        run: python -m compileall examples benchmarks
      - name: Test (offline suite)
        # The default suite is network-free; the live GRPO test is opt-in
        # (AMBERTRACE_RLVR_LIVE) and stays skipped here.
        run: pytest tests/ -q
