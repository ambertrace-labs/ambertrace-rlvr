name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check
      - name: Type check
        run: pyright
      - name: Compile examples & benchmarks
        run: python -m compileall examples benchmarks
      - name: Test (offline suite)
        # The default suite is network-free; the live GRPO test is opt-in
        # (AMBERTRACE_RLVR_LIVE) and stays skipped here.
        run: pytest tests/ -q
