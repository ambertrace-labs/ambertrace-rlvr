<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<style>.ti{fill:#1B1A17;font-size:19px;font-weight:700;letter-spacing:-0.2px;}.sub{fill:#7A776E;font-size:12px;}.eb{fill:#E0982E;font-size:11px;font-weight:700;letter-spacing:1.5px;}.pt{fill:#1B1A17;font-size:12.5px;font-weight:600;}.tk{fill:#7A776E;font-size:10.5px;font-variant-numeric:tabular-nums;}.vl{fill:#1B1A17;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}.ax{fill:#7A776E;font-size:11px;font-variant-numeric:tabular-nums;}.an{fill:#7A776E;font-size:10px;}.bx1{fill:#1B1A17;font-size:12px;font-weight:600;}.bx2{fill:#7A776E;font-size:10.5px;}.bxi{fill:#1B1A17;font-size:10.5px;}</style>
<rect x="0.5" y="0.5" width="759" height="371" rx="14" fill="#F7F6F3" stroke="#E7E4DC"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7A776E"/></marker></defs>
<text x="40" y="34" class="eb">AMBERTRACE · FAITHFULNESS</text>
<text x="40" y="60" class="ti">Why narrow RL transfers caution</text>
<text x="40" y="79" class="sub">The reward never names the OOD domains — the disposition it instils is domain-general.</text>
<rect x="24" y="114" width="300" height="50" rx="9" fill="#FFFFFF" stroke="#E7E4DC"/><text x="174.0" y="135.5" text-anchor="middle" class="bx1">Narrow RL on air-track triage</text><text x="174.0" y="150.5" text-anchor="middle" class="bx2">reward = certificate + correctness</text>
<rect x="24" y="194" width="300" height="50" rx="9" fill="#E0982E" stroke="#B5761F"/><text x="174.0" y="215.5" text-anchor="middle" class="bx1">Transferable disposition</text><text x="174.0" y="230.5" text-anchor="middle" class="bxi">resolve uncertainty → restrictive action</text>
<rect x="24" y="274" width="300" height="50" rx="9" fill="#FFFFFF" stroke="#E7E4DC"/><text x="174.0" y="295.5" text-anchor="middle" class="bx1">Unseen domains</text><text x="174.0" y="310.5" text-anchor="middle" class="bx2">loan · eligibility · …</text>
<rect x="452" y="104" width="284" height="42" rx="9" fill="#FFFFFF" stroke="#E7E4DC"/><text x="594.0" y="129.0" text-anchor="middle" class="bx1">Fail-open rate → 0</text>
<rect x="452" y="164" width="284" height="42" rx="9" fill="#FFFFFF" stroke="#E7E4DC"/><text x="594.0" y="189.0" text-anchor="middle" class="bx1">Signed bias flips: +0.018 → −0.017</text>
<rect x="452" y="224" width="284" height="42" rx="9" fill="#FFFFFF" stroke="#E7E4DC"/><text x="594.0" y="249.0" text-anchor="middle" class="bx1">OOD accuracy: 0.945 → 0.983</text>
